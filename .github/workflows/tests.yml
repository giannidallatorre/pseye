name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is macOS 26 on Apple Silicon, macos-15-intel is the
        # Intel image. Both matter: pseyepy is compiled C++ linked against
        # libusb, and that is the only architecture-specific part.
        os: [macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v5

      - name: shellcheck
        run: command -v shellcheck >/dev/null || brew install shellcheck

      # The documented install path, on both architectures: Homebrew libusb,
      # a virtualenv with Python 3.12-3.14, and pseyepy compiled from the
      # pinned fork. If the driver does not build here, the job fails.
      - name: setup
        run: ./pseye setup

      - name: environment
        run: |
          uname -m
          .venv/bin/python -c 'import platform, sys, numpy, pyvirtualcam, pseyepy; print("python", sys.version.split()[0], "|", platform.machine(), "| numpy", numpy.__version__, "| pyvirtualcam", pyvirtualcam.__version__)'

      - name: tests
        run: ./tests/run.sh cli

      # When setup fails, say exactly what failed: which import, and what the
      # compiled extension links against.
      - name: diagnostics
        if: failure()
        run: |
          uname -m
          ls .venv/lib/python*/site-packages/pseyepy/ 2>/dev/null || true
          otool -L .venv/lib/python*/site-packages/pseyepy/cameras*.so 2>/dev/null || true
          echo "--- import pseyepy"
          .venv/bin/python -c "import pseyepy" 2>&1 | tail -20 || true
          echo "--- import pyvirtualcam"
          .venv/bin/python -c "import pyvirtualcam" 2>&1 | tail -20 || true
